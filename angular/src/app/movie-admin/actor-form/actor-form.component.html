
<div class="container mt-4">
  <h1 class="page-title text-center mb-4">Actor Management</h1>

<div class="card" >
    <div class="card-header">
      <div class="row">
        <div class="col col-md-6">
        </div>
        <div class="text-end col col-md-6">
          <!-- Add the "new actor" button here -->
          <div class="text-lg-end pt-2">
            <button id="create" class="btn btn-primary" type="button" (click)="createActor()" *abpPermission="'MovieManagementApp.Actors.Create'">
              <i class="fa fa-plus mr-1"></i>
              <span>{{ "New Actor" }}</span>
            </button>
          </div>

        </div>
      </div>
    </div>
      <div class="card-body" *ngIf="!loadingData" >
         <ngx-datatable [rows]="actor.items" [count]="actor.totalCount" [list]="list" default>
          <ngx-datatable-column
            [name]="'Actions' "
            [maxWidth]="150"
            [sortable]="false"
          >
            <ng-template let-row="row" ngx-datatable-cell-template>
              <div ngbDropdown container="body" class="d-inline-block">
                <button
                  class="btn btn-primary btn-sm dropdown-toggle"
                  data-toggle="dropdown"
                  aria-haspopup="true"
                  ngbDropdownToggle
                >
                  <i class="fa fa-cog mr-1"></i>{{ 'Actions'}}
                </button>
                <div ngbDropdownMenu>
                  <button ngbDropdownItem (click)="editActor(row.id)">
                    {{ 'Edit'  }}
                  </button>
                  <button ngbDropdownItem (click)="delete(row.id)">
                    {{ 'Delete'  }}
                </button>
                </div>
              </div>
            </ng-template>
          </ngx-datatable-column>
  
          <ngx-datatable-column   [name]="'Actor Name'" [sortable]="true">
            {{actor.items.ActorName | json}}
          </ngx-datatable-column>
          <ngx-datatable-column [name]="'Actor Image'" [maxWidth]="150" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <img *ngIf="row.thumbnail" [src]="row.thumbnail" alt="Actor Image" style="width: 50px; height: auto;" />
            </ng-template>
          </ngx-datatable-column>
          
        </ngx-datatable>
      </div>
      
    </div>
    <abp-modal [(visible)]="isModalOpen">
      <ng-template #abpHeader>
        <h3>{{ (selectedActor.id ? 'Edit' : 'New Actor' ) }}</h3>
      </ng-template>
    
      
      <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="form-group">
            <label for="actor-name">Actor Name</label><span> * </span>
            <input type="text" id="actor-name" class="form-control" formControlName="actorName" autofocus />
          </div>
          <div class="form-group">
            <label for="actor-image">Actor Image</label>
            <input type="file" id="actor-image" class="form-control" (change)="onImageSelected($event)" />
            <div *ngIf="imageUrl" class="mt-2">
              <img [src]="imageUrl" alt="Selected Actor Image" style="width: 100px; height: auto;" />
            </div>
          </div>
        </form>
      </ng-template>
    
      <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>
            {{ 'Close'}}
        </button>
      
        <!--added save button-->
        <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
              <i class="fa fa-check mr-1"></i>
              {{ 'Save' }}
        </button>
      </ng-template>
    </abp-modal>
</div>
