<div class="card">
  <div class="card-header space" *ngIf="!isLoading">
    <!-- السطر الأول: مربع بحث كامل العرض للبحث عن الأفلام -->
    <div class="form-group position-relative mb-3">
      <input
        id="movieSearch"
        type="text"
        [(ngModel)]="movieSearchTerm"
        placeholder="Search for movies by name..."
        class="form-control full-width-search"
      />
      <i class="fa fa-search search-icon" (click)="searchMoviesByName(movieSearchTerm)"></i> <!-- تمرير قيمة البحث -->
    </div>
    <div class="row align-items-center mt-3">
      <!-- مربع البحث عن الممثلين -->
      <div class="col-lg-4 col-md-6 mb-2">
        <div class="form-group position-relative">
          <input
            id="actorSearch"
            type="text"
            [(ngModel)]="actorSearchTerm"
            (input)="searchActors()"
            placeholder="Filter by Actor..."
            class="form-control search-input"
            (focus)="isDropdownActorsOpen = true"
          />
          <ul *ngIf="filteredActors.length > 0 && isDropdownActorsOpen" class="dropdown-menu show">
            <li
              *ngFor="let actor of filteredActors"
              (click)="selectActor(actor)"
              (mouseenter)="hoveredActor = actor"
              (mouseleave)="hoveredActor = null"
              [class.active]="hoveredActor === actor"
            >
              {{ actor.actorName }}
            </li>
          </ul>
        </div>
      </div>
    
      <!-- مربع البحث عن التصنيفات -->
      <div class="col-lg-4 col-md-6 mb-2">
        <div class="form-group position-relative">
          <input
            id="categorySearch"
            type="text"
            [(ngModel)]="categorySearchTerm"
            (input)="searchCategories()"
            placeholder="Filter by Category..."
            class="form-control search-input"
            (focus)="isDropdownOpen = true"
          />
          <ul *ngIf="filteredCategories.length > 0 && isDropdownOpen" class="dropdown-menu show">
            <li
              *ngFor="let category of filteredCategories"
              (click)="selectCategory(category)"
              (mouseenter)="hoveredCategory = category"
              (mouseleave)="hoveredCategory = null"
              [class.active]="hoveredCategory === category"
            >
              {{ category.categoryName }}
            </li>
          </ul>
        </div>
      </div>
    
      <!-- أزرار الفلترة وتصفية النتائج -->
      <div class="col-lg-4 col-md-6 mb-2">
        <button (click)="applyFilters()" class="btn btn-primary filter-btn me-2">Filter Movies</button>
        <button (click)="clearFilters()" class="btn btn-outline-secondary filter-btn">Clear Filter</button>
      </div>
    </div>
    
    

  </div>
</div>
  <div class="card">
  <div class="card-body" >
        <!-- Loading indicator -->
        <div *ngIf="isLoading" class="loading-spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
              <!-- Movies grid -->
              <div class="movies-grid" *ngIf="!isLoading">
                <app-movie-card
                  *ngFor="let movie of movie.items"
                  [movie]="movie">
                </app-movie-card>
              </div>
              <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                  <li class="page-item" [class.disabled]="currentPage === 1">
                    <button class="page-link" (click)="onPageChange(currentPage - 1)"
                      [disabled]="currentPage === 1">Previous</button>
                  </li>
              
                  <ng-container *ngFor="let page of [].constructor(totalPages()); let i = index">
                    <li class="page-item" [class.active]="currentPage === i + 1">
                      <button class="page-link" (click)="onPageChange(i + 1)">{{ i + 1 }}</button>
                    </li>
                  </ng-container>
              
                  <li class="page-item" [class.disabled]="currentPage >= totalPages()">
                    <button class="page-link" (click)="onPageChange(currentPage + 1)"
                      [disabled]="currentPage >= totalPages()">Next</button>
                  </li>
                </ul>
              </nav>
        <!-- No movies message -->
        <div *ngIf="!isLoading && movie.totalCount === 0" class="no-movies-message">
          No movies available. Please add a new movie.
        </div>
      </div>
    </div>
