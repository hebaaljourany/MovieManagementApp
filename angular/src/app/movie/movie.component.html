
<div class="card">
  <div class="card-header" *ngIf="!isLoading">
    <div class="row">

      

    </div>

  </div>
        <!-- Loading indicator -->
        <div *ngIf="isLoading" class="loading-spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
              <!-- Movies grid -->
              <div class="movies-grid" *ngIf="!isLoading">
                <app-movie-card
                  *ngFor="let movie of movie.items"
                  [movie]="movie">
                </app-movie-card>
              </div>

        <!-- No movies message -->
        <div *ngIf="!isLoading && movie.totalCount === 0" class="no-movies-message">
          No movies available. Please add a new movie.
        </div>
      <!--</ngx-datatable>-->
    </div>
